<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ليالي Heartopia الرمضانية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--pink:#e8a9c7;--deep:#875d75;--cream:#fffaf7;--gold:#c9a45d;--ink:#574652}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Alexandria,system-ui,sans-serif}
.shell{max-width:1120px;margin:auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 24px}.brand{display:flex;align-items:center;gap:10px;color:var(--deep);font-weight:800;letter-spacing:1px}.season{font-size:12px;border:1px solid #efd8e3;border-radius:30px;padding:8px 14px;color:var(--deep);background:white}
.hero{position:relative;overflow:hidden;text-align:center;padding:76px 24px 82px;border-radius:34px;background:radial-gradient(circle at 50% 0%,#fff 0,#f9e7ef 50%,#f4dce8 100%);border:1px solid #f0dce5;box-shadow:0 18px 50px #b98ca31c}
.moon{font-size:52px;color:var(--gold);line-height:1;margin-bottom:16px}.eyebrow{color:#b17b99;font-size:12px;font-weight:700;letter-spacing:.5px}h1{font-size:clamp(36px,7vw,68px);line-height:1.35;margin:12px 0;color:var(--deep)}h1 span{color:#d18db0}.intro{max-width:530px;margin:0 auto;color:#866f7d;line-height:2;font-size:14px}
.hero-actions{display:flex;justify-content:center;gap:12px;margin-top:28px;flex-wrap:wrap}.primary,.secondary{padding:13px 22px;border-radius:14px;text-decoration:none;font-size:13px;font-weight:700}.primary{background:var(--deep);color:white;box-shadow:0 8px 20px #875d7533}.secondary{background:#fff;color:var(--deep);border:1px solid #ead5df}.lantern{position:absolute;color:#d6b777;font-size:34px;opacity:.7}.lantern-one{top:24px;right:8%}.lantern-two{bottom:28px;left:9%}
.section{padding:62px 4px 42px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.section-head h2,.access h2{font-size:22px;color:var(--deep);margin:4px 0}.mini-star{font-size:30px;color:var(--gold)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.feature{background:white;border:1px solid #f0e3e9;border-radius:20px;padding:22px;box-shadow:0 8px 24px #9d71800b}.icon,.access-icon{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:#f9eaf1;color:#b77b9b}.feature h3{font-size:15px;margin:17px 0 8px;color:var(--deep)}.feature p,.access p{font-size:12px;line-height:2;color:#8e7c86;margin:0}
.access{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #eee0e7;border-radius:22px;padding:22px}.access>div:nth-child(2){flex:1}.coming{font-size:11px;color:#a27d39;background:#fbf4e4;padding:8px 12px;border-radius:20px;white-space:nowrap}footer{text-align:center;color:#b09aa6;font-size:11px;padding:34px 0 10px}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.hero{padding:58px 18px}.access{align-items:flex-start;flex-wrap:wrap}.coming{margin-right:62px}}@media(max-width:430px){.shell{padding:14px}.cards{grid-template-columns:1fr 1fr}.feature{padding:16px}.feature p{font-size:11px}}

a{color:inherit}button,input,textarea,select{font-family:inherit;font-size:13px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}.nav a{text-decoration:none;font-size:12px;font-weight:600;padding:9px 15px;border-radius:30px;background:#fff;border:1px solid #efd8e3;color:var(--deep)}.nav a.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.topbar .who{display:flex;gap:8px;align-items:center}.btn{border:0;cursor:pointer;padding:11px 18px;border-radius:13px;font-weight:700;background:var(--deep);color:#fff}.btn.sec{background:#fff;color:var(--deep);border:1px solid #ead5df}.btn.ok{background:#6d9a7e}.btn.bad{background:#b86a7a}.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.panel{background:#fff;border:1px solid #f0e3e9;border-radius:20px;padding:22px;box-shadow:0 8px 24px #9d71800b;margin-bottom:16px}.panel h2{margin:0 0 12px;font-size:19px;color:var(--deep)}.panel h3{margin:0 0 6px;font-size:15px;color:var(--deep)}.muted{color:#8e7c86;font-size:12px;line-height:2}
input,textarea,select{width:100%;padding:11px 13px;border:1px solid #ead5df;border-radius:12px;background:#fffdfc;color:var(--ink);margin:4px 0 10px}label{font-size:12px;font-weight:600;color:var(--deep)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.pill{font-size:11px;padding:5px 11px;border-radius:20px;background:#f9eaf1;color:#9b6a86;white-space:nowrap}.pill.g{background:#e6f2ea;color:#4f8062}.pill.y{background:#fbf4e4;color:#a27d39}.pill.r{background:#f7e3e7;color:#a8566a}
table{width:100%;border-collapse:collapse}td,th{padding:11px 8px;text-align:right;border-bottom:1px solid #f4e9ee;font-size:13px}th{color:#a27d96;font-size:11px}
.rank{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#f9eaf1;color:var(--deep);font-weight:800}.rank.r1{background:var(--gold);color:#fff}.rank.r2{background:#bdb4c0;color:#fff}.rank.r3{background:#c9906a;color:#fff}
.thumb{max-width:100%;max-height:260px;border-radius:14px;border:1px solid #f0e3e9;margin-top:8px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.tabs button{border:1px solid #efd8e3;background:#fff;color:var(--deep);padding:8px 14px;border-radius:30px;cursor:pointer;font-weight:600;font-size:12px}.tabs button.on{background:var(--deep);color:#fff}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:12px 20px;border-radius:14px;font-size:13px;box-shadow:0 10px 30px #0003;z-index:9}
.keys{display:flex;gap:6px;font-size:26px;color:var(--gold)}.bar{height:12px;border-radius:10px;background:#f4e9ee;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#e8a9c7,#c9a45d)}
.demo{background:#fbf4e4;border:1px dashed #e0c98e;border-radius:14px;padding:12px 16px;font-size:12px;line-height:2;color:#7d6530}.demo b{direction:ltr;unicode-bidi:embed}.ann{border-right:3px solid var(--gold);padding:4px 14px;margin-bottom:12px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}

.cdgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:10px auto 4px}.cdgrid div{background:#fbf4e4;border:1px solid #efe0b8;border-radius:16px;padding:14px 6px}.cdgrid b{display:block;font-size:30px;color:var(--deep);font-variant-numeric:tabular-nums}.cdgrid span{font-size:11px;color:#a27d39}
@media(max-width:430px){.cdgrid b{font-size:24px}}

.annimg{display:block;max-width:100%;max-height:420px;border-radius:16px;margin-top:10px;border:1px solid #f0e3e9}.ann .muted{white-space:pre-line}

.prizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.prz{background:#fff;border:1px solid #f0e3e9;border-radius:22px;padding:18px;box-shadow:0 8px 24px #9d71800b}.przhead{display:flex;align-items:center;gap:10px}.przhead h3{margin:0;font-size:17px;color:var(--deep)}.przplace{font-size:26px;min-width:34px;text-align:center}.przimg{display:block;width:100%;max-height:220px;object-fit:contain;background:#fbf4e4;border-radius:16px;margin:12px 0}.przhow{white-space:pre-line;font-size:13px;line-height:2;color:#7b6671;margin:8px 0 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';document.head.appendChild(s)"></script>
</head><body><div id="app"></div><script>(()=>{
// ====== الإعدادات: الصقي المفتاح (Publishable key) هنا ======
const CFG={url:'https://nlkavuljvknpiaoeperj.supabase.co',key:'sb_publishable_WEoD-8gW2yi_ZFGHyUmvFw_P_Q577a1'};
// ============================================================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d).toLocaleDateString('ar-SA',{day:'numeric',month:'short'}):'';
const MEM={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return MEM[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){MEM[k]=v}}};
const getKey=()=>CFG.key||store.get('lh_key')||'';
const ST={pending:['بانتظار المراجعة','y'],approved:['معتمد','g'],rejected:['مرفوض','r'],resubmit:['مطلوب إعادة إرسال','y']};
const RAR={common:['عادي',''],rare:['نادر','y'],epic:['أسطوري','r']};
const TYPES={badge:'وسام',title:'لقب',cosmetic:'عنصر تجميلي'};
const IDEAS=[['صيد','أكبر سمكة','اصطادي أكبر سمكة خلال ساعة وصوّري الشاشة مع الوزن.'],['صيد','أندر سمكة','اصطادي أندر سمكة تقدرين عليها وصوّريها.'],['تصوير','صيد الطيور بالكاميرا','صوّري ٣ أنواع مختلفة من الطيور في اللعبة.'],['تصوير','صيد الحشرات بالكاميرا','صوّري ٣ أنواع مختلفة من الحشرات.'],['بيوت','بيت بثيمة رمضانية','صمّمي بيتك بطابع رمضاني وصوّري الغرفة.'],['رسم','ارسمي شخصيتك','ارسمي شخصيتك في اللعبة بأي أسلوب وارفعي الرسمة.'],['أزياء','أفضل إطلالة بثيمة','نسّقي إطلالة على ثيمة تحددها الإدارة وصوّريها.'],['باركور','باركور نونا','أسرع وقت في مسار باركور تجهزه نونا، صوّري الوقت النهائي.'],['جمع','الفقاعات الوردية','اجمعي أكبر عدد من الفقاعات الوردية في ساعة.'],['مجتمع','إفطار جماعي','نظّمي لقاء داخل اللعبة وصوّري المائدة.']];

let sb=null,me=null,cur='#/',armed='',editTask=null,editPrize=null,adminTab='review',showAdmin=false,newCode=null,busy=false;
try{cur=location.hash||'#/'}catch(e){}
const emptyC=()=>({anns:[],board:[],tasks:[],subs:[],points:[],grants:[],keys:[],chests:[],rewards:[],settings:[],rank:null,cd:null,prizes:[],profiles:[],codes:[],audit:[]});
let C=emptyC();
const isStaff=()=>!!me&&['admin','moderator'].includes(me.role);
const isAdmin=()=>!!me&&me.role==='admin';
const name=id=>(C.profiles.find(p=>p.id===id)||{}).display_name||'—';
const total=id=>C.points.filter(p=>p.user_id===id).reduce((a,b)=>a+b.points,0);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function errmsg(e){const m=(e&&(e.message||e.error_description))||String(e);
  if(/Invalid login/i.test(m))return 'الرمز غير صحيح';
  if(/Failed to fetch|NetworkError/i.test(m))return 'تعذر الاتصال، تأكدي من الإنترنت';
  if(/row-level security/i.test(m))return 'غير مسموح لك بهذا الإجراء';
  if(/duplicate key/i.test(m))return 'موجود مسبقًا';
  return m}

// ---------- البيانات ----------
const rows=async p=>{const r=await p;if(r.error)throw r.error;return r.data};
async function loadMe(){
  const {data}=await sb.auth.getSession();const u=data&&data.session&&data.session.user;
  if(!u){me=null;return}
  const r=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
  if(r.error){await sb.auth.signOut();me=null;return 'err:'+(r.error.message||r.error.code)}
  if(!r.data||!r.data.is_active){await sb.auth.signOut();me=null;return 'inactive'}
  me={id:u.id,name:r.data.display_name,role:r.data.role};
}
async function refresh(){
  const j={anns:rows(sb.from('announcements').select('*').order('created_at',{ascending:false})),board:rows(sb.from('public_leaderboard').select('*'))};
  j.cd=sb.from('settings').select('countdown_title,countdown_at').eq('id',1).maybeSingle().then(r=>r.error?null:r.data);
  j.prizes=sb.from('prizes').select('*').order('place').then(r=>r.error?[]:r.data);
  if(me){
    j.tasks=rows(sb.from('tasks').select('*').order('week').order('created_at'));
    j.subs=rows(sb.from('submissions').select('*').order('submitted_at',{ascending:false}));
    j.points=rows(sb.from('point_transactions').select('*').order('created_at',{ascending:false}));
    j.grants=rows(sb.from('chest_grants').select('*').order('granted_at',{ascending:false}));
    j.keys=rows(sb.from('treasure_keys').select('*'));
    j.chests=rows(sb.from('chests').select('*').order('created_at'));
    j.rewards=rows(sb.from('chest_rewards').select('*').order('created_at'));
    j.settings=rows(sb.from('settings').select('*').limit(1));
    if(!isStaff())j.rank=rows(sb.rpc('my_rank'));
    if(isStaff()){j.profiles=rows(sb.from('profiles').select('*').order('created_at'));j.audit=rows(sb.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(100))}
    if(isAdmin())j.codes=rows(sb.from('participant_codes').select('*'));
  }else C=emptyC();
  const ks=Object.keys(j);
  try{const vs=await Promise.all(ks.map(k=>j[k]));ks.forEach((k,i)=>C[k]=vs[i])}catch(e){toast(errmsg(e))}
}
const log=(action,entity,reason)=>sb.from('audit_logs').insert({actor_id:me.id,action,entity:entity||'',reason:reason||''});
async function done(msg){await refresh();if(msg)toast(msg);render()}
async function run(fn,msg){if(busy)return;busy=true;try{await fn();await done(msg)}catch(e){toast(errmsg(e));render()}finally{busy=false}}

// ---------- الواجهة ----------
function shell(body,active){
  const links=[['#/','الرئيسية'],['#/leaderboard','المتصدرات']];
  if(me){links.push(['#/tasks','المهام'],['#/chests','الصناديق'],['#/treasure','الكنز']);if(!isStaff())links.push(['#/me','ملفي']);if(isStaff())links.push(['#/admin','الإدارة'])}
  return `<main class="shell"><header class="topbar"><div class="brand">🌙<span>LAYALI HEARTOPIA</span></div>
  <div class="who">${me?`<span class="season">${esc(me.name)}${isStaff()?' · إدارة':''}</span><button class="btn sec sm" type="button" data-act="logout">خروج</button>`:`<a class="season" href="#/login">دخول المشاركات</a>`}</div></header>
  <nav class="nav">${links.map(([h,t])=>`<a href="${h}" class="${active===h?'on':''}">${t}</a>`).join('')}</nav>${body}
  <footer>صُنعت بحب ✦ ليالي Heartopia الرمضانية</footer></main>`;
}
const delBtn=(kind,id,label='حذف')=>`<button type="button" class="btn bad sm" data-act="del" data-kind="${kind}" data-id="${id}">${armed===kind+id?'تأكيد الحذف؟':label}</button>`;
const lbTable=(rows,mine)=>`<table><tr><th>#</th><th>المشاركة</th><th>النقاط</th></tr>${rows.map(x=>`<tr><td><span class="rank r${x.rank}">${x.rank}</span></td><td>${esc(x.display_name)}${mine&&x.user_id===mine.id?' <span class="pill">أنتِ</span>':''}</td><td><b>${x.points}</b></td></tr>`).join('')||'<tr><td colspan=3 class="muted">لا نتائج بعد</td></tr>'}</table>`;
const evBox=s=>s?`<div class="ev" data-path="${esc(s.evidence_path)}" data-type="${esc(s.evidence_type)}"><span class="muted">جارٍ تحميل الإثبات…</span></div>`:'';
const need=()=>{if(!me){cur='#/login';return false}return true};
const mySub=tid=>C.subs.find(x=>x.task_id===tid&&x.user_id===me.id);

const cdHtml=()=>{const c=C.cd;if(!c||!c.countdown_at)return'';
  return `<section class="panel cd" id="cd" data-at="${esc(c.countdown_at)}" style="margin-top:18px;text-align:center"><p class="eyebrow">⏳ ${esc(c.countdown_title||'العد التنازلي')}</p>
  <div class="cdgrid"><div><b id="cd-d">0</b><span>يوم</span></div><div><b id="cd-h">0</b><span>ساعة</span></div><div><b id="cd-m">0</b><span>دقيقة</span></div><div><b id="cd-s">0</b><span>ثانية</span></div></div>
  <h3 id="cd-end" style="display:none;margin:6px 0">🌙 حان الوقت! انطلقنا</h3></section>`};
function tick(){const el=$('#cd');if(!el)return;const t=new Date(el.dataset.at)-Date.now();if(isNaN(t))return;
  if(t<=0){el.querySelector('.cdgrid').style.display='none';$('#cd-end').style.display='block';return}
  const sec=Math.floor(t/1000),set=(k,v)=>{const n=$('#cd-'+k);if(n)n.textContent=v};
  set('d',Math.floor(sec/86400));set('h',Math.floor(sec%86400/3600));set('m',Math.floor(sec%3600/60));set('s',sec%60)}
setInterval(tick,1000);
const toLocalInput=iso=>{if(!iso)return'';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
const pub=p=>sb.storage.from('media').getPublicUrl(p).data.publicUrl;
const annImg=a=>a.image_path?`<img class="annimg" src="${esc(pub(a.image_path))}" alt="">`:'';
const PL=['🥇','🥈','🥉'];
const prizesHtml=()=>{if(!C.prizes.length)return'';
  return `<section class="section" id="prizes"><div class="section-head"><div><p class="eyebrow">للفائزات</p><h2>الجوائز</h2></div><span class="mini-star">✦</span></div>
  <div class="prizes">${C.prizes.map(p=>`<article class="prz"><div class="przhead"><span class="przplace">${PL[p.place-1]||p.place}</span><h3>${esc(p.title)}</h3></div>${p.image_path?`<img class="przimg" src="${esc(pub(p.image_path))}" alt="">`:''}<p class="przhow">${esc(p.how_to)}</p></article>`).join('')}</div></section>`};
const V={};
V['/']=()=>{
  const anns=C.anns.filter(a=>a.published);
  return shell(`<section class="hero"><div class="moon">☾</div><p class="eyebrow">أهلًا بكِ في عالمنا الرمضاني</p><h1>ليالي <span>Heartopia</span><br>الرمضانية</h1>
  <p class="intro">مساحة تجمع التحدي والإبداع والصداقات… وكل إنجاز له حكاية.</p>
  <div class="hero-actions"><a class="primary" href="${me?(isStaff()?'#/admin':'#/tasks'):'#/login'}">${me?'ادخلي':'دخول المشاركات'}</a><a class="secondary" href="#/leaderboard">المتصدرات</a></div><div class="lantern lantern-one">✧</div><div class="lantern lantern-two">✦</div></section>
  ${cdHtml()}
  ${prizesHtml()}
  <section class="section"><div class="section-head"><div><p class="eyebrow">داخل البطولة</p><h2>كل شيء في مكان واحد</h2></div><span class="mini-star">✦</span></div>
  <div class="cards">${[['🏆','المتصدرات','عرض أفضل عشر مشاركات في الموسم.','#/leaderboard'],['📋','المهام','تابعي المهام وأرسلي إثباتاتك للمراجعة.','#/tasks'],['✨','الصناديق','مكافآت رمزية وأوسمة أسبوعية.','#/chests'],['🗝️','مفاتيح الكنز','تُكتسب المفاتيح من المراكز الأولى فقط.','#/treasure']].map(([i,t,d,h])=>`<a href="${h}" style="text-decoration:none"><article class="feature"><div class="icon">${i}</div><h3>${t}</h3><p>${d}</p></article></a>`).join('')}</div></section>
  <div class="grid2"><div class="panel"><h2>الإعلانات</h2>${anns.map(a=>`<div class="ann"><h3>${esc(a.title)}</h3><div class="muted">${esc(a.body)}</div>${annImg(a)}</div>`).join('')||'<p class="muted">لا إعلانات.</p>'}</div>
  <div class="panel"><h2>المتصدرات</h2>${lbTable(C.board.slice(0,5))}<p class="muted"><a href="#/leaderboard">عرض الكل</a></p></div></div>`,'#/');
};
V['/leaderboard']=()=>shell(`<div class="panel"><h2>🏆 المتصدرات — أفضل ١٠ مشاركات</h2>${lbTable(C.board,me)}<p class="muted">النقاط تُحسب من الإثباتات المعتمدة فقط.</p></div>`,'#/leaderboard');
V['/login']=()=>shell(`<div class="panel" style="max-width:460px;margin:auto"><h2>بوابة الدخول الخاصة</h2>
  ${showAdmin?`<form id="adminf"><label>إيميل الإدارة</label><input name="email" type="email" dir="ltr" required placeholder="admin@layali.app"><label>كلمة السر</label><input name="password" type="password" dir="ltr" required><button class="btn" style="width:100%">دخول الإدارة</button></form>`
  :`<p class="muted">أدخلي رمزك الشخصي الذي وصلك من الإدارة.</p><form id="loginf"><label>الرمز الشخصي</label><input name="code" dir="ltr" autocomplete="off" placeholder="LAYALI-XXXXXX" required><button class="btn" style="width:100%">دخول</button></form>`}
  <p class="muted" style="margin-top:14px"><a href="#" data-act="toggleadmin">${showAdmin?'← دخول المشاركات':'دخول الإدارة'}</a></p></div>`,'#/login');

V['/tasks']=()=>{if(!need())return'';
  const list=C.tasks;
  return shell(`<div class="panel"><h2>📋 المهام</h2>${list.map(t=>{const s=mySub(t.id);const [l,c]=s?ST[s.status]:['لم تُرسل',''];
  return `<div class="row" style="padding:12px 0;border-bottom:1px solid #f4e9ee"><div class="sp"><h3>${esc(t.title)}${t.published?'':' <span class="pill">مسودة</span>'}</h3><div class="muted">${esc(t.cat)} · الأسبوع ${t.week} · حتى ${t.max_points} نقطة</div></div>${isStaff()?'':`<span class="pill ${c}">${l}</span>`}<a class="btn sm" href="#/task/${t.id}" style="text-decoration:none">فتح</a></div>`}).join('')||'<p class="muted">لا مهام حاليًا.</p>'}</div>`,'#/tasks');
};
V['/task']=id=>{if(!need())return'';
  const t=C.tasks.find(x=>x.id===id);if(!t)return shell('<div class="panel">المهمة غير موجودة.</div>');
  const s=isStaff()?null:mySub(id);const can=!isStaff()&&(!s||['pending','resubmit'].includes(s.status));
  return shell(`<div class="panel"><a href="#/tasks" class="muted">← كل المهام</a><h2>${esc(t.title)}</h2><p>${esc(t.description)}</p><p class="muted">الإثبات المطلوب: ${esc(t.evidence)} · الحد الأعلى ${t.max_points} نقطة</p></div>
  ${isStaff()?'':`<div class="panel"><h2>إثباتي</h2>${s?`<div class="row"><span class="pill ${ST[s.status][1]}">${ST[s.status][0]}</span><span class="muted">أُرسل ${fmt(s.submitted_at)}</span></div>${evBox(s)}${s.note?`<p class="muted">ملاحظتك: ${esc(s.note)}</p>`:''}${s.review_reason?`<div class="demo">ملاحظة المراجعة: ${esc(s.review_reason)}</div>`:''}`:'<p class="muted">لم ترسلي إثباتًا بعد.</p>'}
  ${can?`<form id="subf" data-task="${t.id}" style="margin-top:14px"><label>صورة أو فيديو الإثبات (حتى ٤٥ ميجا)</label><input type="file" name="file" accept="image/*,video/*" required><label>ملاحظة (اختياري)</label><textarea name="note" rows="2"></textarea><button class="btn">${s?'إعادة الإرسال':'إرسال للمراجعة'}</button></form>`:'<p class="muted">تم إغلاق هذا الإثبات.</p>'}</div>`}`,'#/tasks');
};
V['/chests']=()=>{if(!need())return'';
  const mine=C.grants.filter(g=>g.user_id===me.id);
  return shell(`<div class="panel"><h2>✨ الصناديق الأسبوعية</h2><p class="muted">تحصلين على صندوق من الإدارة حسب أدائك. افتحيه وتطلع لك مكافأة عشوائية: وسام أو لقب أو عنصر تجميلي (مكافآت رمزية فقط). النادر والأسطوري فرصهما أقل.</p></div>
  <div class="panel"><h2>صناديقي</h2>${mine.map(g=>{const c=C.chests.find(x=>x.id===g.chest_id);const r=g.reward_id&&C.rewards.find(x=>x.id===g.reward_id);
   return `<div class="row" style="padding:10px 0;border-bottom:1px solid #f4e9ee"><span style="font-size:26px">🎁</span><div class="sp"><h3>${esc(c&&c.title)}</h3><div class="muted">${esc(g.reason||'')}</div></div>${g.reward_id?(r?`<span class="pill ${RAR[r.rarity][1]}">${esc(r.title)} · ${RAR[r.rarity][0]}</span>`:'<span class="pill g">مفتوح</span>'):`<button class="btn sm" type="button" data-act="open" data-id="${g.id}">افتحي الصندوق</button>`}</div>`}).join('')||'<p class="muted">ما عندك صناديق بعد. شاركي في الفعاليات!</p>'}</div>
  <div class="panel"><h2>وش داخل الصناديق؟</h2>${C.chests.map(c=>`<h3>${esc(c.title)}</h3><p class="muted">${esc(c.descr||'')}</p>${C.rewards.filter(r=>r.chest_id===c.id).map(r=>`<span class="pill ${RAR[r.rarity][1]}" style="margin:2px">${esc(r.title)} · ${TYPES[r.type]} · ${RAR[r.rarity][0]}</span>`).join('')||'<span class="muted">فارغ حاليًا</span>'}`).join('<hr style="border:0;border-top:1px solid #f4e9ee;margin:14px 0">')}</div>`,'#/chests');
};
V['/treasure']=()=>{if(!need())return'';
  const my=C.keys.filter(k=>k.user_id===me.id),tr=C.settings[0]||{treasure_title:'الكنز',treasure_need:1,treasure_desc:''};
  return shell(`<div class="panel"><h2>🗝️ ${esc(tr.treasure_title)}</h2><p>${esc(tr.treasure_desc)}</p><div class="bar"><i style="width:${Math.min(100,my.length/tr.treasure_need*100)}%"></i></div><p class="muted">مفاتيحك: ${my.length} من ${tr.treasure_need} ${my.length>=tr.treasure_need?'— 🎉 يحق لكِ فتح الكنز!':''}</p>
  <p class="muted">المفاتيح تُمنح للمراكز الثلاثة الأولى فقط.</p></div>
  <div class="panel"><h3>مفاتيحي</h3>${my.map(k=>`<div class="row"><span class="keys">🗝️</span><span>المركز ${k.place} — ${esc(k.why)}</span></div>`).join('')||'<p class="muted">لا مفاتيح بعد.</p>'}</div>`,'#/treasure');
};
V['/me']=()=>{if(!need())return'';
  const mine=C.subs.filter(s=>s.user_id===me.id);
  return shell(`<div class="panel"><h2>ملفي: ${esc(me.name)}</h2><div class="row"><span class="pill g">${total(me.id)} نقطة</span><span class="pill">المركز ${C.rank||'—'}</span><span class="pill y">${C.keys.filter(k=>k.user_id===me.id).length} مفتاح</span></div></div>
  <div class="panel"><h3>إثباتاتي (خاصة بي وبالإدارة فقط)</h3>${mine.map(s=>`<div class="row" style="padding:8px 0"><span class="sp">${esc((C.tasks.find(t=>t.id===s.task_id)||{}).title)}</span><span class="pill ${ST[s.status][1]}">${ST[s.status][0]}</span></div>`).join('')||'<p class="muted">لا إثباتات.</p>'}</div>
  <div class="panel"><h3>جوائزي</h3>${C.grants.filter(g=>g.user_id===me.id&&g.reward_id).map(g=>{const r=C.rewards.find(x=>x.id===g.reward_id);return r?`<span class="pill ${RAR[r.rarity][1]}" style="margin:2px">${esc(r.title)}</span>`:''}).join('')||'<p class="muted">—</p>'}</div>
  <div class="panel"><h3>سجل نقاطي</h3>${C.points.filter(p=>p.user_id===me.id).map(p=>`<div class="row" style="padding:6px 0"><span class="sp">${esc(p.reason)}</span><b>${p.points>0?'+':''}${p.points}</b></div>`).join('')||'<p class="muted">—</p>'}</div>`,'#/me');
};

V['/admin']=()=>{if(!need())return'';if(!isStaff())return shell('<div class="panel">هذه الصفحة للإدارة فقط.</div>');
  const pend=C.subs.filter(s=>s.status==='pending');
  const tabs=[['review','المراجعة'],['tasks','المهام'],['people','المشاركات'],['rewards','الصناديق والمفاتيح'],['ann','الإعلانات والكنز'],['prizes','الجوائز'],['audit','سجل التدقيق']];
  const parts=C.profiles.filter(p=>p.role==='participant');
  const opt=a=>a.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('');
  let b='';
  if(adminTab==='review'){b=pend.map(s=>{const t=C.tasks.find(x=>x.id===s.task_id)||{};return `<div class="panel"><h3>${esc(name(s.user_id))} — ${esc(t.title)}</h3>${evBox(s)}${s.note?`<p class="muted">${esc(s.note)}</p>`:''}
      <form class="revf" data-id="${s.id}"><div class="grid2"><div><label>النقاط (حتى ${t.max_points})</label><input type="number" name="pts" min="0" max="${t.max_points}" value="${t.max_points}"></div><div><label>السبب / ملاحظة</label><input name="reason"></div></div>
      <div class="row"><button class="btn ok sm" name="d" value="approved">اعتماد</button><button class="btn sec sm" name="d" value="resubmit">طلب إعادة</button><button class="btn bad sm" name="d" value="rejected">رفض</button></div></form></div>`}).join('')||'<div class="panel muted">لا إثباتات بانتظار المراجعة 🎉</div>'}
  if(adminTab==='tasks'){const et=C.tasks.find(x=>x.id===editTask)||{};
    b=`<div class="panel"><h2>${editTask?'تعديل الفعالية':'فعالية / مهمة جديدة'}</h2><form id="taskf"><label>العنوان</label><input name="title" required value="${esc(et.title)}"><label>الوصف</label><textarea name="description" rows="2" required>${esc(et.description)}</textarea><div class="grid2"><div><label>الإثبات المطلوب</label><input name="evidence" value="${esc(et.evidence)}"></div><div><label>التصنيف (صيد، تصوير، بيوت…)</label><input name="cat" value="${esc(et.cat)}"></div><div><label>النقاط (الحد الأعلى)</label><input type="number" name="max" value="${et.max_points??30}" min="0"></div><div><label>الأسبوع</label><input type="number" name="week" value="${et.week??1}" min="1"></div></div><div class="row"><button class="btn">${editTask?'حفظ التعديل':'إضافة'}</button>${editTask?'<button type="button" class="btn sec" data-act="canceledit">إلغاء</button>':''}</div></form></div>
    <div class="panel"><h2>الفعاليات الحالية</h2>${C.tasks.map(t=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #f4e9ee"><span class="sp"><b>${esc(t.title)}</b> <span class="muted">${esc(t.cat)} · أسبوع ${t.week} · ${t.max_points} نقطة</span></span><span class="pill ${t.published?'g':''}">${t.published?'منشورة':'مسودة'}</span><button type="button" class="btn sec sm" data-act="togtask" data-id="${t.id}">${t.published?'إخفاء':'نشر'}</button><button type="button" class="btn sec sm" data-act="edittask" data-id="${t.id}">تعديل</button>${delBtn('task',t.id)}</div>`).join('')||'<p class="muted">لا فعاليات.</p>'}</div>
    <div class="panel"><h2>💡 بنك الأفكار</h2><p class="muted">اضغطي «أضيفي» تنزل الفكرة كمسودة تعدّلينها وتنشرينها.</p>${IDEAS.map((x,i)=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #f4e9ee"><span class="pill">${x[0]}</span><span class="sp"><b>${x[1]}</b><div class="muted">${x[2]}</div></span><button type="button" class="btn sm" data-act="idea" data-id="${i}">أضيفي</button></div>`).join('')}</div>`}
  if(adminTab==='people'){const codes=Object.fromEntries(C.codes.map(c=>[c.user_id,c.code]));
    b=`${newCode?`<div class="panel demo"><b>تم إنشاء حساب ${esc(newCode.name)}</b><br>الرمز: <b style="font-size:18px;user-select:all">${esc(newCode.code)}</b><br>انسخيه وأرسليه لها. (تلقينه دايمًا في الجدول تحت.)</div>`:''}
    <div class="panel"><h2>إضافة مشاركة</h2><form id="userf" class="row"><input name="name" placeholder="الاسم" required style="flex:1"><button class="btn">إنشاء رمز</button></form></div>
    <div class="panel"><table><tr><th>الاسم</th><th>الرمز</th><th>النقاط</th><th>الحالة</th><th></th></tr>${parts.map(u=>`<tr><td>${esc(u.display_name)}</td><td dir="ltr">${esc(codes[u.id]||'—')}</td><td>${total(u.id)}</td><td><span class="pill ${u.is_active?'g':'r'}">${u.is_active?'نشطة':'موقوفة'}</span></td><td class="row"><button type="button" class="btn sec sm" data-act="togu" data-id="${u.id}">${u.is_active?'إيقاف':'تفعيل'}</button>${isAdmin()?delBtn('user',u.id):''}</td></tr>`).join('')||'<tr><td colspan=5 class="muted">لا مشاركات بعد</td></tr>'}</table></div>
    ${isAdmin()?`<div class="panel"><h3>تعديل نقاط يدوي</h3><form id="ptf" class="grid2"><div><label>المشاركة</label><select name="pid">${opt(parts.map(u=>[u.id,u.display_name]))}</select></div><div><label>النقاط (+/−)</label><input type="number" name="pts" required></div><div style="grid-column:1/-1"><label>السبب (إجباري)</label><input name="reason" required><button class="btn">تسجيل</button></div></form></div>`:''}`}
  if(adminTab==='rewards'){const weeks=[...new Set(C.tasks.map(t=>t.week))].sort((a,b)=>a-b);const top3=C.board.filter(x=>x.rank<=3).slice(0,3);
    b=`<div class="panel"><h2>صندوق جديد</h2><form id="chf" class="grid2"><div><label>الاسم</label><input name="title" required></div><div><label>الوصف / متى يُمنح</label><input name="desc"></div><div style="grid-column:1/-1"><button class="btn">إنشاء</button></div></form></div>
    ${C.chests.map(c=>`<div class="panel"><div class="row"><h3 class="sp">🎁 ${esc(c.title)}</h3>${delBtn('chest',c.id)}</div><p class="muted">${esc(c.descr||'')}</p>
      ${C.rewards.filter(r=>r.chest_id===c.id).map(r=>`<div class="row" style="padding:4px 0"><span class="pill ${RAR[r.rarity][1]}">${RAR[r.rarity][0]}</span><span class="sp">${esc(r.title)} <span class="muted">(${TYPES[r.type]})</span></span>${delBtn('reward',r.id)}</div>`).join('')||'<p class="muted">فارغ — أضيفي مكافآت.</p>'}
      <form class="rwf row" data-chest="${c.id}" style="margin-top:10px"><input name="title" placeholder="اسم المكافأة" required style="flex:2;min-width:140px"><select name="type" style="flex:1">${opt(Object.entries(TYPES))}</select><select name="rarity" style="flex:1">${opt([['common','عادي'],['rare','نادر'],['epic','أسطوري']])}</select><button class="btn sm">إضافة</button></form></div>`).join('')}
    <div class="panel"><h2>منح صندوق</h2><form id="gf" class="grid2"><div><label>الصندوق</label><select name="chest">${opt(C.chests.map(c=>[c.id,c.title]))}</select></div><div><label>المشاركة</label><select name="pid">${opt(parts.map(u=>[u.id,u.display_name]))}</select></div><div style="grid-column:1/-1"><label>السبب</label><input name="reason" placeholder="مثال: الأولى في الأسبوع 1"><button class="btn">منح</button></div></form>
      <hr style="border:0;border-top:1px solid #f4e9ee;margin:14px 0"><h3>منح تلقائي لأفضل ٣ في أسبوع</h3><form id="agf" class="row"><select name="week" style="flex:1">${opt(weeks.map(w=>[w,'الأسبوع '+w]))}</select><select name="chest" style="flex:2">${opt(C.chests.map(c=>[c.id,c.title]))}</select><button class="btn">منح</button></form></div>
    <div class="panel"><h3>الصناديق الممنوحة</h3>${C.grants.map(g=>`<div class="row" style="padding:5px 0"><span class="sp">${esc(name(g.user_id))} — ${esc((C.chests.find(c=>c.id===g.chest_id)||{}).title)} <span class="muted">${esc(g.reason||'')}</span></span><span class="pill ${g.reward_id?'g':'y'}">${g.reward_id?esc((C.rewards.find(r=>r.id===g.reward_id)||{}).title||'مفتوح'):'لم تُفتح'}</span>${delBtn('grant',g.id)}</div>`).join('')||'<p class="muted">—</p>'}</div>
    ${isAdmin()?`<div class="panel"><h2>مفاتيح الكنز — المراكز ١–٣ فقط</h2>${top3.map(x=>`<div class="row" style="padding:8px 0"><span class="rank r${x.rank}">${x.rank}</span><span class="sp">${esc(x.display_name)} — ${x.points} نقطة</span>${C.keys.some(k=>k.user_id===x.user_id&&k.why==='ختام الموسم')?'<span class="pill g">مُنح</span>':`<button type="button" class="btn sm" data-act="key" data-id="${x.user_id}" data-place="${x.rank}">منح مفتاح</button>`}</div>`).join('')||'<p class="muted">لا نتائج بعد.</p>'}<p class="muted">يُمنح المفتاح لمن حصلت على مركز ١–٣ فقط، ولا يتكرر للمشاركة نفسها.</p>
    ${C.keys.map(k=>`<div class="row" style="padding:4px 0"><span class="sp">🗝️ ${esc(name(k.user_id))} — المركز ${k.place}</span>${delBtn('key',k.id)}</div>`).join('')}</div>`:''}`}
  if(adminTab==='ann'){const tr=C.settings[0]||{};
    b=`<div class="panel"><h2>إعلان جديد</h2><form id="annf"><label>العنوان</label><input name="title" required><label>النص (تقدرين تكتبين عدة أسطر)</label><textarea name="body" rows="4" required></textarea><label>صورة (اختياري، مثل شكل الهدية)</label><input type="file" name="image" accept="image/*"><button class="btn">نشر</button></form></div>${C.anns.map(a=>`<div class="panel row"><div class="sp"><h3>${esc(a.title)}</h3><div class="muted">${esc(a.body)}</div>${annImg(a)}</div>${delBtn('ann',a.id)}</div>`).join('')}
    ${isAdmin()?`<div class="panel"><h2>⏳ العد التنازلي (يظهر في الصفحة الرئيسية)</h2><form id="cdf"><label>العنوان (مثال: يبدأ رمضان بعد)</label><input name="title" value="${esc((C.cd||{}).countdown_title)}" required><label>التاريخ والوقت</label><input type="datetime-local" name="at" value="${toLocalInput((C.cd||{}).countdown_at)}" required><div class="row"><button class="btn">حفظ</button><button type="button" class="btn sec" data-act="clearcd">إزالة العد</button></div></form></div>
    <div class="panel"><h2>إعدادات الكنز</h2><form id="trf"><label>الاسم</label><input name="title" value="${esc(tr.treasure_title)}" required><label>عدد المفاتيح المطلوبة</label><input type="number" name="need" min="1" value="${tr.treasure_need??1}"><label>الوصف</label><textarea name="desc" rows="2">${esc(tr.treasure_desc)}</textarea><button class="btn">حفظ</button></form></div>`:''}`}
  if(adminTab==='prizes'){const ep=C.prizes.find(x=>x.id===editPrize)||{};
    b=`<div class="panel"><h2>${editPrize?'تعديل الجائزة':'جائزة جديدة'}</h2><form id="przf"><div class="grid2"><div><label>المركز (١ أو ٢ أو ٣)</label><input type="number" name="place" min="1" value="${ep.place??C.prizes.length+1}"></div><div><label>اسم الجائزة</label><input name="title" required value="${esc(ep.title)}" placeholder="مثال: اشتراك شهري"></div></div>
    <label>كيف تستلم الفائزة الجائزة؟</label><textarea name="how" rows="4" placeholder="مثال: تتواصل معك الإدارة خلال ٣ أيام وترسل لك الجائزة على حسابك في اللعبة">${esc(ep.how_to)}</textarea>
    <label>صورة الجائزة (اختياري)</label><input type="file" name="image" accept="image/*"><div class="row"><button class="btn">${editPrize?'حفظ التعديل':'إضافة'}</button>${editPrize?'<button type="button" class="btn sec" data-act="cancelprize">إلغاء</button>':''}</div></form></div>
    <div class="panel"><h2>الجوائز الحالية</h2><p class="muted">اضغطي أيقونة الكاميرا 📷 جنب أي جائزة عشان ترفعين أو تغيّرين صورتها مباشرة.</p>${C.prizes.map(p=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #f4e9ee"><span class="przplace">${PL[p.place-1]||p.place}</span>${p.image_path?`<img src="${esc(pub(p.image_path))}" style="width:56px;height:56px;object-fit:cover;border-radius:12px" alt="">`:''}<span class="sp"><b>${esc(p.title)}</b><div class="muted">${esc(p.how_to)}</div></span><label class="btn sec sm" style="cursor:pointer;margin:0">📷<input type="file" accept="image/*" data-prz="${p.id}" style="display:none"></label><button type="button" class="btn sec sm" data-act="editprize" data-id="${p.id}">تعديل</button>${delBtn('prize',p.id)}</div>`).join('')||'<p class="muted">لا جوائز بعد.</p>'}</div>`}
  if(adminTab==='audit'){b=`<div class="panel"><h2>سجل التدقيق</h2><table><tr><th>الوقت</th><th>الإجراء</th><th>التفاصيل</th></tr>${C.audit.map(a=>`<tr><td>${fmt(a.created_at)}</td><td>${esc(a.action)}</td><td class="muted">${esc(a.entity)} ${esc(a.reason)}</td></tr>`).join('')||'<tr><td colspan=3 class="muted">فارغ</td></tr>'}</table></div>`}
  return shell(`<div class="tabs">${tabs.map(([k,t])=>`<button type="button" data-tab="${k}" class="${adminTab===k?'on':''}">${t}${k==='review'?` (${pend.length})`:''}</button>`).join('')}</div>${b}`,'#/admin');
};

function setupPage(){return `<main class="shell"><div class="panel" style="max-width:560px;margin:40px auto"><h2>🔑 آخر خطوة: ربط الموقع</h2>
 <p class="muted">افتحي Supabase ← Project Settings ← API Keys، وانسخي المفتاح اللي يبدأ بـ <b dir="ltr">sb_publishable_</b> (مو المفتاح السري!) والصقيه هنا.</p>
 <label>Publishable key</label><input id="keyin" dir="ltr" placeholder="sb_publishable_..."><button class="btn" type="button" data-act="savekey">حفظ</button>
 <p class="muted">للتثبيت الدائم لكل الأجهزة: حطي المفتاح داخل الملف في أول سطر (key:'').</p></div></main>`}

function render(){
  if(!sb){$('#app').innerHTML=setupPage();return}
  const h=cur.slice(1);const [,a,id]=h.split('/');const key='/'+(a||'');
  const f=V[key]||V['/'];$('#app').innerHTML=f(id);scrollTo(0,0);hydrate();tick();
}
async function hydrate(){
  for(const el of document.querySelectorAll('.ev[data-path]')){
    const p=el.dataset.path,t=el.dataset.type;
    const r=await sb.storage.from('evidence').createSignedUrl(p,3600);
    if(r.error||!r.data){el.innerHTML='<span class="muted">تعذر عرض الإثبات</span>';continue}
    el.innerHTML=t==='video'?`<video class="thumb" controls src="${r.data.signedUrl}"></video>`:`<img class="thumb" src="${r.data.signedUrl}">`;
  }
}
async function go(h){cur=h;try{location.hash=h}catch(e){}$('#app').innerHTML='<main class="shell"><p class="muted" style="text-align:center;padding:60px">جارٍ التحميل…</p></main>';await refresh();render()}
function shrink(file){return new Promise(res=>{if(!file.type.startsWith('image/'))return res(null);const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.82)};i.onerror=()=>res(null);i.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genCode=()=>{const b=new Uint8Array(6);crypto.getRandomValues(b);return 'LAYALI-'+[...b].map(x=>A[x%A.length]).join('')};
async function signin(email,password){
  const {error}=await sb.auth.signInWithPassword({email,password});if(error)return toast(errmsg(error));
  const st=await loadMe();if(st==='inactive')return toast('حسابك غير مفعّل، كلّمي الإدارة');if(st)return toast('تعذر قراءة الحساب: '+st.slice(4));
  await go(isStaff()?'#/admin':'#/tasks');
}

async function uploadMedia(file,dir){
  if(file.size>10*1024*1024)throw new Error('الصورة كبيرة، الحد ١٠ ميجا');
  const blob=(await shrink(file))||file;const path=`${dir}/${Date.now()}.jpg`;
  const up=await sb.storage.from('media').upload(path,blob,{contentType:'image/jpeg'});if(up.error)throw up.error;return path}
async function handleForm(f,fd,sub){
  if(f.id==='loginf'){const code=(fd.get('code')||'').trim().toUpperCase().replace(/\s+/g,'');return signin(code.toLowerCase()+'@layali.app',code)}
  if(f.id==='adminf')return signin((fd.get('email')||'').trim(),fd.get('password'));
  if(f.id==='subf')return run(async()=>{
    const file=fd.get('file');if(!file||!file.size)throw new Error('اختاري ملفًا');if(file.size>45*1024*1024)throw new Error('الملف كبير، الحد ٤٥ ميجا');
    const video=file.type.startsWith('video/');let blob=file,ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'bin';
    if(!video){const b=await shrink(file);if(b){blob=b;ext='jpg'}}
    const tid=f.dataset.task,path=`${me.id}/${tid}-${Date.now()}.${ext}`;
    const up=await sb.storage.from('evidence').upload(path,blob,{contentType:blob.type||file.type||'application/octet-stream'});if(up.error)throw up.error;
    const r=await sb.rpc('submit_evidence',{p_task:tid,p_path:path,p_type:video?'video':'image',p_note:fd.get('note')||''});if(r.error)throw r.error;
  },'تم الإرسال للمراجعة ✦');
  if(f.classList.contains('revf'))return run(async()=>{
    const r=await sb.rpc('review_submission',{p_id:f.dataset.id,p_decision:sub.value,p_points:+fd.get('pts')||0,p_reason:(fd.get('reason')||'').trim()});if(r.error)throw r.error},'تم');
  if(f.id==='taskf')return run(async()=>{
    const o={title:fd.get('title'),description:fd.get('description'),evidence:fd.get('evidence')||'صورة',cat:fd.get('cat')||'',max_points:+fd.get('max')||0,week:+fd.get('week')||1};
    let r;if(editTask){r=await sb.from('tasks').update(o).eq('id',editTask);editTask=null}else r=await sb.from('tasks').insert({...o,published:true});
    if(r.error)throw r.error;await log('task:save',o.title)},'تم الحفظ');
  if(f.id==='userf')return run(async()=>{
    const n=fd.get('name').trim(),code=genCode();
    const tmp=window.supabase.createClient(CFG.url,getKey(),{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
    const {data,error}=await tmp.auth.signUp({email:code.toLowerCase()+'@layali.app',password:code,options:{data:{display_name:n}}});
    if(error)throw error;const uid=data&&data.user&&data.user.id;if(!uid)throw new Error('تعذر إنشاء الحساب');
    let r=await sb.rpc('admin_activate',{p_user:uid});if(r.error)throw r.error;
    r=await sb.from('participant_codes').insert({user_id:uid,code});if(r.error)throw r.error;
    newCode={name:n,code};},'تم إنشاء الحساب');
  if(f.id==='ptf')return run(async()=>{const r=await sb.rpc('adjust_points',{p_user:fd.get('pid'),p_points:+fd.get('pts'),p_reason:fd.get('reason')});if(r.error)throw r.error},'تم');
  if(f.id==='chf')return run(async()=>{const r=await sb.from('chests').insert({title:fd.get('title'),descr:fd.get('desc')});if(r.error)throw r.error;await log('chest:create',fd.get('title'))});
  if(f.classList.contains('rwf'))return run(async()=>{const r=await sb.from('chest_rewards').insert({chest_id:f.dataset.chest,type:fd.get('type'),title:fd.get('title'),rarity:fd.get('rarity')});if(r.error)throw r.error});
  if(f.id==='gf')return run(async()=>{if(!fd.get('chest')||!fd.get('pid'))throw new Error('اختاري الصندوق والمشاركة');const r=await sb.from('chest_grants').insert({chest_id:fd.get('chest'),user_id:fd.get('pid'),reason:fd.get('reason')});if(r.error)throw r.error;await log('chest:grant',name(fd.get('pid')),fd.get('reason'))},'تم المنح');
  if(f.id==='agf')return run(async()=>{if(!fd.get('chest')||!fd.get('week'))throw new Error('أنشئي صندوقًا ومهام أولًا');const r=await sb.rpc('autogrant_week',{p_week:+fd.get('week'),p_chest:fd.get('chest')});if(r.error)throw r.error;if(!r.data)throw new Error('ما فيه نقاط لهذا الأسبوع')},'تم منح الصناديق');
  if(f.id==='przf')return run(async()=>{
    const o={place:+fd.get('place')||1,title:fd.get('title'),how_to:fd.get('how')||''};const file=fd.get('image');const old=editPrize&&C.prizes.find(x=>x.id===editPrize);
    if(file&&file.size){o.image_path=await uploadMedia(file,'prize');if(old&&old.image_path)await sb.storage.from('media').remove([old.image_path])}
    let r;if(editPrize){r=await sb.from('prizes').update(o).eq('id',editPrize);editPrize=null}else r=await sb.from('prizes').insert(o);
    if(r.error)throw r.error;await log('prize:save',o.title)},'تم حفظ الجائزة');
  if(f.id==='annf')return run(async()=>{
    const o={title:fd.get('title'),body:fd.get('body')};const file=fd.get('image');
    if(file&&file.size){if(file.size>10*1024*1024)throw new Error('الصورة كبيرة، الحد ١٠ ميجا');
      const blob=(await shrink(file))||file;const path=`ann/${Date.now()}.jpg`;
      const up=await sb.storage.from('media').upload(path,blob,{contentType:'image/jpeg'});if(up.error)throw up.error;o.image_path=path}
    const r=await sb.from('announcements').insert(o);if(r.error)throw r.error;await log('announcement',o.title)},'تم النشر');
  if(f.id==='cdf')return run(async()=>{const at=fd.get('at');if(!at)throw new Error('اختاري التاريخ');const r=await sb.from('settings').update({countdown_title:fd.get('title'),countdown_at:new Date(at).toISOString()}).eq('id',1);if(r.error)throw r.error},'تم حفظ العد التنازلي');
  if(f.id==='trf')return run(async()=>{const r=await sb.from('settings').update({treasure_title:fd.get('title'),treasure_need:+fd.get('need')||1,treasure_desc:fd.get('desc')||''}).eq('id',1);if(r.error)throw r.error},'تم الحفظ');
}
const TABLES={prize:'prizes',task:'tasks',ann:'announcements',chest:'chests',reward:'chest_rewards',grant:'chest_grants',key:'treasure_keys'};
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('click',e=>{
  const an=e.target.closest('a[href^="#/"]');if(an){e.preventDefault();go(an.getAttribute('href'));return}
  const fb=e.target.closest('form button');if(fb&&fb.form&&!fb.dataset.act){e.preventDefault();handleForm(fb.form,new FormData(fb.form),fb).catch(x=>toast(errmsg(x)));return}
  const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
  if(t.dataset.tab){adminTab=t.dataset.tab;return render()}
  const a=t.dataset.act,id=t.dataset.id;
  if(a!=='del'&&armed)armed='';
  if(a==='savekey'){const k=($('#keyin').value||'').trim();if(!k)return;store.set('lh_key',k);init();return}
  if(a==='toggleadmin'){e.preventDefault();showAdmin=!showAdmin;render();return}
  if(a==='logout'){sb.auth.signOut().then(()=>{me=null;C=emptyC();go('#/')});return}
  if(a==='del'){e.preventDefault();const k=t.dataset.kind+id;if(armed!==k){armed=k;render();return}armed='';const kind=t.dataset.kind;
    run(async()=>{let r;
      if(kind==='prize'){const x=C.prizes.find(a=>a.id===id);if(x&&x.image_path)await sb.storage.from('media').remove([x.image_path])}
      if(kind==='ann'){const x=C.anns.find(a=>a.id===id);if(x&&x.image_path)await sb.storage.from('media').remove([x.image_path])}
      if(kind==='user')r=await sb.rpc('admin_delete_user',{p_user:id});else r=await sb.from(TABLES[kind]).delete().eq('id',id);
      if(r.error)throw r.error;if(kind!=='user')await log('delete:'+kind,id)},'تم الحذف');return}
  if(a==='clearcd'){run(async()=>{const r=await sb.from('settings').update({countdown_title:null,countdown_at:null}).eq('id',1);if(r.error)throw r.error},'تمت الإزالة');return}
  if(a==='editprize'){editPrize=id;render();return}
  if(a==='cancelprize'){editPrize=null;render();return}
  if(a==='edittask'){editTask=id;render();return}
  if(a==='canceledit'){editTask=null;render();return}
  if(a==='togtask'){const x=C.tasks.find(x=>x.id===id);run(async()=>{const r=await sb.from('tasks').update({published:!x.published}).eq('id',id);if(r.error)throw r.error});return}
  if(a==='togu'){const x=C.profiles.find(x=>x.id===id);run(async()=>{const r=await sb.from('profiles').update({is_active:!x.is_active}).eq('id',id);if(r.error)throw r.error;await log('user:toggle',x.display_name)});return}
  if(a==='idea'){const x=IDEAS[+id];adminTab='tasks';run(async()=>{const r=await sb.from('tasks').insert({title:x[1],description:x[2],evidence:'صورة أو فيديو',cat:x[0],max_points:30,week:1,published:false});if(r.error)throw r.error},'أُضيفت كمسودة — عدّليها وانشريها');return}
  if(a==='key'){const place=+t.dataset.place;run(async()=>{const r=await sb.from('treasure_keys').insert({user_id:id,place,why:'ختام الموسم',awarded_by:me.id});if(r.error)throw r.error;await log('key:award',name(id),'المركز '+place)},'تم منح المفتاح 🗝️');return}
  if(a==='open'){run(async()=>{const r=await sb.rpc('open_chest',{p_grant:id});if(r.error)throw r.error;toast('🎉 حصلتِ على: '+(r.data&&r.data.title))});return}
});
document.addEventListener('change',e=>{const i=e.target.closest('input[data-prz]');if(!i||!i.files[0])return;const id=i.dataset.prz,file=i.files[0];
  run(async()=>{const old=C.prizes.find(x=>x.id===id);const path=await uploadMedia(file,'prize');const r=await sb.from('prizes').update({image_path:path}).eq('id',id);if(r.error)throw r.error;if(old&&old.image_path)await sb.storage.from('media').remove([old.image_path])},'تم رفع الصورة')});
addEventListener('hashchange',()=>{const h=location.hash||'#/';if(h!==cur)go(h)});

async function init(){
  for(let i=0;i<60&&!window.supabase;i++)await new Promise(r=>setTimeout(r,100));
  document.body.innerHTML='<div id="app"></div>';
  if(!getKey()||!window.supabase){sb=null;$('#app').innerHTML=window.supabase?setupPage():'<main class="shell"><div class="panel">تعذر تحميل مكتبة Supabase، تأكدي من الإنترنت ثم حدّثي الصفحة.</div></main>';return}
  sb=window.supabase.createClient(CFG.url,getKey());
  try{await loadMe()}catch(e){}
  await refresh();render();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script></body></html>
